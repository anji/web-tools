name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site directory under sites/ to deploy, or "all"'
        default: all

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Which sites actually need rebuilding. A change under packages/ is shared, so
  # it rebuilds everything; a change under sites/<name>/ rebuilds only that one.
  changed:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.detect.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          DISPATCH_SITE: ${{ github.event.inputs.site }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=$(ls -d sites/*/ | xargs -n1 basename | jq -R . | jq -sc .)

          if [ "${DISPATCH_SITE:-}" = "all" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "sites=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "${DISPATCH_SITE:-}" ]; then
            echo "sites=$(jq -nc --arg s "$DISPATCH_SITE" '[$s]')" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # First push to a branch has no usable "before" ref.
          if [ -z "${BEFORE:-}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            echo "sites=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi

          files=$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}")
          if echo "$files" | grep -qE '^(packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|tsconfig\.base\.json|scripts/|\.github/workflows/)'; then
            echo "sites=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # `|| true` matters: grep exits non-zero when a push touches no site,
          # and under `set -e` that would fail the step rather than deploy
          # nothing. Piping an empty line into jq would also yield [""].
          changed=$(echo "$files" | grep -oE '^sites/[^/]+' | cut -d/ -f2 | sort -u || true)
          if [ -z "$changed" ]; then
            echo "sites=[]" >> "$GITHUB_OUTPUT"
          else
            echo "sites=$(printf '%s\n' "$changed" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, changed]
    if: github.event_name != 'pull_request' && needs.changed.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changed.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "./sites/${{ matrix.site }}" build

      # The privacy claim is the product. Verify it against the built artefact
      # under its real headers before anything ships.
      - name: Verify no egress is possible
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/serve-static.mjs "sites/${{ matrix.site }}/dist" 4330 &
          for i in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:4330/ && break
            sleep 1
          done
          node sites/${{ matrix.site }}/test/browser.mjs http://127.0.0.1:4330
          node scripts/verify-egress.mjs http://127.0.0.1:4330/

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sites/${{ matrix.site }}
          command: deploy
